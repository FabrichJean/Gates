

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);color:var(--color-text-primary);background:transparent}
.shell{display:grid;grid-template-rows:auto 1fr;height:600px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;background:var(--color-background-primary)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary)}
.topbar-left{display:flex;align-items:center;gap:6px}
.topbar-right{display:flex;align-items:center;gap:8px}
.tb-btn{font-size:12px;padding:5px 12px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);cursor:pointer}
.tb-btn:hover{background:var(--color-background-secondary)}
.search-box{font-size:12px;padding:5px 10px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);color:var(--color-text-primary);width:180px;outline:none}
.search-box:focus{border-color:var(--color-border-primary)}
.view-toggle{display:flex;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);overflow:hidden}
.vt-btn{font-size:12px;padding:5px 10px;border:none;background:transparent;color:var(--color-text-secondary);cursor:pointer;display:flex;align-items:center;gap:4px}
.vt-btn.active{background:var(--color-background-secondary);color:var(--color-text-primary)}
.body{display:grid;grid-template-columns:200px 1fr;height:100%;overflow:hidden}
.sidebar{border-right:0.5px solid var(--color-border-tertiary);padding:12px 8px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.sidebar-label{font-size:10px;font-weight:500;color:var(--color-text-tertiary);padding:6px 8px 4px;letter-spacing:.06em;text-transform:uppercase}
.drive-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--border-radius-md);cursor:pointer;font-size:13px;color:var(--color-text-secondary)}
.drive-item:hover{background:var(--color-background-secondary);color:var(--color-text-primary)}
.drive-item.active{background:var(--color-background-secondary);color:var(--color-text-primary);font-weight:500}
.drive-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.drive-meta{display:flex;flex-direction:column;gap:1px}
.drive-name{font-size:12px;line-height:1.3}
.drive-sub{font-size:10px;color:var(--color-text-tertiary);line-height:1.3}
.main{display:flex;flex-direction:column;overflow:hidden}
.breadcrumb{display:flex;align-items:center;gap:4px;padding:10px 16px;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px;color:var(--color-text-secondary)}
.bc-sep{color:var(--color-text-tertiary);font-size:10px}
.bc-part{cursor:pointer;padding:2px 4px;border-radius:4px}
.bc-part:hover{background:var(--color-background-secondary);color:var(--color-text-primary)}
.bc-part.current{color:var(--color-text-primary);font-weight:500;cursor:default}
.bc-part.current:hover{background:transparent}
.toolbar-strip{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:0.5px solid var(--color-border-tertiary)}
.sel-count{font-size:11px;color:var(--color-text-secondary)}
.file-area{flex:1;overflow-y:auto;padding:14px 16px}
.grid-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.file-card{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:12px 10px 10px;cursor:pointer;transition:border-color .12s,background .12s;position:relative;display:flex;flex-direction:column;gap:8px;background:var(--color-background-primary)}
.file-card:hover{border-color:var(--color-border-secondary);background:var(--color-background-secondary)}
.file-card.selected{border-color:var(--color-border-info);background:var(--color-background-info)}
.fc-check{position:absolute;top:8px;right:8px;width:16px;height:16px;border-radius:4px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);display:flex;align-items:center;justify-content:center;cursor:pointer}
.fc-check.checked{background:var(--color-background-info);border-color:var(--color-border-info)}
.fc-check svg{width:10px;height:10px;stroke:var(--color-text-info);stroke-width:2.5;fill:none;display:none}
.fc-check.checked svg{display:block}
.fc-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.fc-name{font-size:12px;font-weight:500;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-meta{font-size:10px;color:var(--color-text-tertiary)}
.list-view{display:flex;flex-direction:column}
.list-header{display:grid;grid-template-columns:24px 1fr 80px 90px 70px;gap:8px;align-items:center;padding:6px 10px;font-size:11px;color:var(--color-text-tertiary);border-bottom:0.5px solid var(--color-border-tertiary);font-weight:500}
.list-row{display:grid;grid-template-columns:24px 1fr 80px 90px 70px;gap:8px;align-items:center;padding:7px 10px;font-size:12px;border-radius:var(--border-radius-md);cursor:pointer;transition:background .1s}
.list-row:hover{background:var(--color-background-secondary)}
.list-row.selected{background:var(--color-background-info)}
.list-name{display:flex;align-items:center;gap:7px;overflow:hidden}
.list-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-icon{font-size:15px;flex-shrink:0}
.muted{color:var(--color-text-secondary)}
.chk{width:14px;height:14px;cursor:pointer;accent-color:var(--color-text-info)}
.type-badge{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);color:var(--color-text-secondary);width:fit-content}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:180px;gap:8px;color:var(--color-text-tertiary);font-size:13px}
</style>

<div class="shell">
  <div class="topbar">
    <div class="topbar-left">
      <button class="tb-btn" id="btn-new">+ New</button>
      <button class="tb-btn">↑ Upload</button>
    </div>
    <div class="topbar-right">
      <input class="search-box" id="search" placeholder="Search files…">
      <div class="view-toggle">
        <button class="vt-btn active" id="vt-grid" title="Grid">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="currentColor"><rect x="0" y="0" width="6" height="6" rx="1.5"/><rect x="8" y="0" width="6" height="6" rx="1.5"/><rect x="0" y="8" width="6" height="6" rx="1.5"/><rect x="8" y="8" width="6" height="6" rx="1.5"/></svg>
          Grid
        </button>
        <button class="vt-btn" id="vt-list" title="List">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="currentColor"><rect x="0" y="0" width="14" height="2.5" rx="1"/><rect x="0" y="5.5" width="14" height="2.5" rx="1"/><rect x="0" y="11" width="14" height="2.5" rx="1"/></svg>
          List
        </button>
      </div>
    </div>
  </div>

  <div class="body">
    <div class="sidebar">
      <div class="sidebar-label">My Drives</div>
      <div id="drive-list"></div>
      <div class="sidebar-label" style="margin-top:10px">Quick access</div>
      <div class="drive-item"><span>⭐</span><span class="drive-name">Starred</span></div>
      <div class="drive-item"><span>🕐</span><span class="drive-name">Recent</span></div>
      <div class="drive-item"><span>🗑</span><span class="drive-name">Trash</span></div>
    </div>

    <div class="main">
      <div class="breadcrumb" id="breadcrumb"></div>
      <div class="toolbar-strip">
        <span class="sel-count" id="sel-count">0 selected</span>
        <span style="font-size:11px;color:var(--color-text-tertiary)" id="item-count"></span>
      </div>
      <div class="file-area" id="file-area"></div>
    </div>
  </div>
</div>

<script>
const drives=[
  {id:'personal',name:'Personal',icon:'👤',color:'#E6F1FB',sub:'4.2 GB used',children:[
    {id:'f1',name:'Documents',type:'folder',children:[
      {id:'f1a',name:'Resume_2025.pdf',type:'file',ext:'pdf',size:'245 KB',modified:'Mar 10'},
      {id:'f1b',name:'Cover Letter.docx',type:'file',ext:'docx',size:'80 KB',modified:'Mar 8'},
      {id:'f1c',name:'Tax Returns',type:'folder',children:[
        {id:'f1c1',name:'2024_tax.pdf',type:'file',ext:'pdf',size:'1.2 MB',modified:'Feb 1'},
      ]},
    ]},
    {id:'f2',name:'Photos',type:'folder',children:[
      {id:'f2a',name:'vacation_2024.zip',type:'file',ext:'zip',size:'320 MB',modified:'Jan 15'},
      {id:'f2b',name:'profile.jpg',type:'file',ext:'jpg',size:'3.4 MB',modified:'Feb 20'},
    ]},
    {id:'f3',name:'Projects',type:'folder',children:[
      {id:'f3a',name:'budget_tracker.xlsx',type:'file',ext:'xlsx',size:'510 KB',modified:'Mar 12'},
    ]},
    {id:'f4',name:'notes.txt',type:'file',ext:'txt',size:'12 KB',modified:'Mar 14'},
    {id:'f5',name:'design_brief.pdf',type:'file',ext:'pdf',size:'2.1 MB',modified:'Mar 11'},
  ]},
  {id:'work',name:'Work',icon:'💼',color:'#E1F5EE',sub:'11.8 GB used',children:[
    {id:'w1',name:'Q1 Reports',type:'folder',children:[
      {id:'w1a',name:'q1_summary.xlsx',type:'file',ext:'xlsx',size:'890 KB',modified:'Mar 5'},
      {id:'w1b',name:'forecast.pptx',type:'file',ext:'pptx',size:'4.5 MB',modified:'Feb 28'},
    ]},
    {id:'w2',name:'Design Assets',type:'folder',children:[
      {id:'w2a',name:'brand_kit.fig',type:'file',ext:'fig',size:'22 MB',modified:'Mar 1'},
    ]},
    {id:'w3',name:'meeting_notes.docx',type:'file',ext:'docx',size:'56 KB',modified:'Mar 13'},
    {id:'w4',name:'roadmap_2025.pdf',type:'file',ext:'pdf',size:'1.8 MB',modified:'Mar 9'},
  ]},
  {id:'shared',name:'Shared',icon:'🔗',color:'#FAEEDA',sub:'Shared with you',children:[
    {id:'s1',name:'Team Docs',type:'folder',children:[
      {id:'s1a',name:'onboarding_guide.pdf',type:'file',ext:'pdf',size:'3.2 MB',modified:'Feb 15'},
    ]},
    {id:'s2',name:'product_spec.docx',type:'file',ext:'docx',size:'410 KB',modified:'Mar 7'},
  ]},
]

const extColors={pdf:'#FCEBEB',docx:'#E6F1FB',xlsx:'#EAF3DE',pptx:'#FAEEDA',zip:'#F1EFE8',jpg:'#FBEAF0',png:'#FBEAF0',fig:'#EEEDFE',txt:'#F1EFE8'}
const extText={pdf:'#A32D2D',docx:'#185FA5',xlsx:'#3B6D11',pptx:'#854F0B',zip:'#5F5E5A',jpg:'#993556',png:'#993556',fig:'#3C3489',txt:'#5F5E5A'}
const fileIcons={pdf:'📄',docx:'📝',xlsx:'📊',pptx:'📑',zip:'📦',jpg:'🖼',png:'🖼',fig:'🎨',txt:'📃',folder:'📁'}

let activeDrive=drives[0]
let pathStack=[]
let selected={}
let view='grid'
let query=''

function currentNode(){
  let node={children:activeDrive.children}
  for(const name of pathStack){
    node=node.children.find(c=>c.name===name)||node
  }
  return node
}

function getFiles(){
  const items=currentNode().children||[]
  if(!query)return items
  const q=query.toLowerCase()
  return items.filter(i=>i.name.toLowerCase().includes(q))
}

function renderDrives(){
  const el=document.getElementById('drive-list')
  el.innerHTML=drives.map(d=>`
    <div class="drive-item${d.id===activeDrive.id?' active':''}" onclick="selectDrive('${d.id}')">
      <div class="drive-icon" style="background:${d.color}">${d.icon}</div>
      <div class="drive-meta">
        <div class="drive-name">${d.name}</div>
        <div class="drive-sub">${d.sub}</div>
      </div>
    </div>
  `).join('')
}

function renderBreadcrumb(){
  const el=document.getElementById('breadcrumb')
  const parts=[{name:activeDrive.name,idx:-1},...pathStack.map((n,i)=>({name:n,idx:i}))]
  el.innerHTML=parts.map((p,i)=>`
    ${i>0?'<span class="bc-sep">›</span>':''}
    <span class="bc-part${i===parts.length-1?' current':''}" onclick="navTo(${p.idx})">${p.name}</span>
  `).join('')
}

function renderFiles(){
  const files=getFiles()
  const area=document.getElementById('file-area')
  document.getElementById('item-count').textContent=files.length+' item'+(files.length!==1?'s':'')
  updateSelCount()

  if(!files.length){
    area.innerHTML='<div class="empty-state"><span style="font-size:28px">🗂</span><span>No files found</span></div>'
    return
  }

  if(view==='grid'){
    area.innerHTML=`<div class="grid-view">${files.map(f=>fileCardHTML(f)).join('')}</div>`
  } else {
    area.innerHTML=`
      <div class="list-view">
        <div class="list-header"><div></div><div>Name</div><div>Type</div><div>Modified</div><div>Size</div></div>
        ${files.map(f=>listRowHTML(f)).join('')}
      </div>`
  }
}

function fileCardHTML(f){
  const isFol=f.type==='folder'
  const icon=fileIcons[f.ext]||fileIcons[f.type]||'📄'
  const bg=isFol?'#F1F5F9':extColors[f.ext]||'#F1F5F9'
  const sel=selected[f.id]
  return `
    <div class="file-card${sel?' selected':''}" id="fc-${f.id}" ondblclick="openNode('${f.id}')" onclick="handleCardClick(event,'${f.id}')">
      <div class="fc-check${sel?' checked':''}" onclick="event.stopPropagation();toggleSel('${f.id}')">
        <svg viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5"/></svg>
      </div>
      <div class="fc-icon" style="background:${bg}">${icon}</div>
      <div class="fc-name" title="${f.name}">${f.name}</div>
      <div class="fc-meta">${isFol?(f.children?.length||0)+' items':f.size||'—'}</div>
    </div>`
}

function listRowHTML(f){
  const isFol=f.type==='folder'
  const icon=fileIcons[f.ext]||fileIcons[f.type]||'📄'
  const ext=f.ext?f.ext.toUpperCase():isFol?'Folder':'—'
  const extBg=extColors[f.ext]||'#F1F5F9'
  const extTx=extText[f.ext]||'#5F5E5A'
  const sel=selected[f.id]
  return `
    <div class="list-row${sel?' selected':''}" ondblclick="openNode('${f.id}')" onclick="handleCardClick(event,'${f.id}')">
      <input type="checkbox" class="chk" ${sel?'checked':''} onclick="event.stopPropagation();toggleSel('${f.id}')">
      <div class="list-name"><span class="list-icon">${icon}</span><span>${f.name}</span></div>
      <div><span class="type-badge" style="background:${extBg};color:${extTx};border-color:${extBg}">${ext}</span></div>
      <div class="muted" style="font-size:11px">${f.modified||'—'}</div>
      <div class="muted" style="font-size:11px">${isFol?'—':f.size||'—'}</div>
    </div>`
}

function updateSelCount(){
  const n=Object.values(selected).filter(Boolean).length
  document.getElementById('sel-count').textContent=n===0?'0 selected':n+' selected'
}

function selectDrive(id){
  activeDrive=drives.find(d=>d.id===id)
  pathStack=[]
  selected={}
  renderDrives();renderBreadcrumb();renderFiles()
}

function openNode(id){
  const files=getFiles()
  const node=files.find(f=>f.id===id)
  if(!node)return
  if(node.type==='folder'){pathStack=[...pathStack,node.name];selected={};renderBreadcrumb();renderFiles()}
}

function navTo(idx){
  if(idx===-1){pathStack=[];selected={};renderBreadcrumb();renderFiles();return}
  pathStack=pathStack.slice(0,idx+1);selected={};renderBreadcrumb();renderFiles()
}

function toggleSel(id){
  selected[id]=!selected[id]
  renderFiles()
}

function handleCardClick(e,id){
  if(e.target.tagName==='INPUT')return
}

window.selectDrive=selectDrive
window.openNode=openNode
window.navTo=navTo
window.toggleSel=toggleSel
window.handleCardClick=handleCardClick

document.getElementById('vt-grid').onclick=()=>{view='grid';document.getElementById('vt-grid').classList.add('active');document.getElementById('vt-list').classList.remove('active');renderFiles()}
document.getElementById('vt-list').onclick=()=>{view='list';document.getElementById('vt-list').classList.add('active');document.getElementById('vt-grid').classList.remove('active');renderFiles()}
document.getElementById('search').oninput=e=>{query=e.target.value;renderFiles()}

renderDrives();renderBreadcrumb();renderFiles()
</script>
